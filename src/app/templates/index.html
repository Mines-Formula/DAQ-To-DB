<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Pipeline</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}" />
</head>

<img src="{{ url_for('static', filename='img/logo.png') }}" class="corner-logo" alt="Pipeline Logo">

<body class="bg-light d-flex vh-100 overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="(Logo)" class="navbar-logo me-2">
                    <span>The Pipeline</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-content="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link px-3" href="http://fsaelinux:4000/Software/Services" target="_blank">
                                <i class="bi bi-journal-text me-1"></i> The Wiki
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="http://fsaelinux:3000/" target="_blank">
                                <i class="bi bi-bar-chart-fill me-1"></i> Grafana
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="https://rerun.io/viewer" target="_blank">
                                <i class="bi bi-arrow-repeat me-1"></i> Rerun Viewer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3"
                                href="https://forms.monday.com/forms/6b26e559297653fdb6ad2e70732037b0?r=use1"
                                target="_blank">
                                <i class="bi bi-lightbulb-fill me-1 text-warning"></i> Feature Request
                            </a>
                        </li>
                    </ul>
                </div>
        </div>
    </nav>

    <main
        class="flex-grow-1 d-flex flex-column justify-content-center align-items-center overflow-auto position-relative">
        <div class="text-center w-100">

            <div class="text-center w-100 mt-5 pt-4">
                <div class="form-check form-switch d-flex justify-content-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" role="switch" id="debugToggle">
                    <label class="form-check-label fw-bold text-secondary" for="debugToggle">Debug Mode</label>
                </div>
            </div>

            <div id="dropZone" class="drop-zone mx-auto rounded-3 bg-white shadow-sm
                 d-flex flex-column justify-content-center align-items-center
                 text-center p-5 mb-3">

                <p class="fw-semibold fst-italic mb-0">
                    Drag Data Here<br>
                    <small class="text-muted">or click to upload</small>
                </p>
                <input type="file" id="fileInput" accept=".data" hidden multiple />
            </div>

            <div id="alertContainer"></div>
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-sm m-2 card shadow-sm" style="max-width: 25rem;">
                    <div class="card-header bg-white fw-semibold border-bottom-0 pt-3">
                        Rerun Files
                    </div>
                    <ul id="csvfileList" class="list-group list-group-flush" style="height: 25rem; overflow: auto;">
                        <li class="list-group-item text-muted border-top">Loading…</li>
                    </ul>
                </div>

                <div class="col-sm m-2 card shadow-sm" style="max-width: 25rem">
                    <div class="card-header bg-white fw-semibold border-bottom-0 pt-3">
                        CSV Files
                    </div>
                    <ul id="rerunfileList" class="list-group list-group-flush" style="height: 25rem; overflow: auto;">
                        <li class="list-group-item text-muted border-top">Loading…</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>

</html>
